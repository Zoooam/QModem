name: Build QModem for x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-23.05.4
          PACKAGES: qmodem luci-app-qmodem-next luci-app-qmodem-sms luci-app-qmodem-mwan
          EXTRA_FEEDS: src-git luci https://github.com/openwrt/luci.git;openwrt-23.05 | src-git packages https://github.com/openwrt/packages.git;openwrt-23.05
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-x86_64-packages
          path: bin/packages/x86_64/packages/*.ipk
          if-no-files-found: error
