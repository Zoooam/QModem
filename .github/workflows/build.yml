name: Build QModem for x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-23.05.4
          PACKAGES: qmodem luci-app-qmodem-next luci-app-qmodem-sms luci-app-qmodem-mwan
          pre-build: |
            set -e
            # 替换默认源为 GitHub 镜像，提高稳定性
            sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default
            # 添加额外 feed
            echo 'src-git luci https://github.com/openwrt/luci.git;openwrt-23.05' >> feeds.conf.default
            echo 'src-git packages https://github.com/openwrt/packages.git;openwrt-23.05' >> feeds.conf.default
            # 打印配置（检查）
            echo "=== feeds.conf.default ==="
            cat feeds.conf.default
            # 更新 feeds
            ./scripts/feeds update -a -v
            # ✅ 关键：安装所有 feed 中的包
            ./scripts/feeds install -a
          V: s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-x86_64-packages
          path: bin/packages/x86_64/packages/*.ipk
          if-no-files-found: error
