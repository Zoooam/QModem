name: Build QModem for x86_64

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-openwrt-24.10
          PACKAGES: qmodem luci-app-qmodem-next luci-app-qmodem-sms luci-app-qmodem-mwan
          EXTRA_FEEDS: |
            src-git luci https://github.com/openwrt/luci.git;openwrt-24.10
            src-git packages https://github.com/openwrt/packages.git;openwrt-24.10
          V: s

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-x86_64
          path: bin/packages/x86_64/packages/*.ipk
          if-no-files-found: error
