name: Test Build

on:
  pull_request:
    branches: [ "main" ]
  # 添加手动触发，方便随时编译
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 指定需要编译的架构，x86_64 是你需要的
        arch: [ x86_64 ]
        # 如果需要其他架构，可以在这里添加，例如: [ x86_64, mips_24kc ]
    steps:
      - uses: actions/upload-artifact@v4
        with:
          fetch-depth: 0
      - name: Build
        # 使用官方 SDK Action
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
      - name: Store packages
        uses: actions/upload-artifact@v2
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/packages/*.ipk
