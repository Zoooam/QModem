name: Test Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: x86_64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          PACKAGES: qmodem luci-app-qmodem-next luci-app-qmodem-sms luci-app-qmodem-mwan luci-app-qmodem-ttl luci-app-qmodem-monitor

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-packages
          path: bin/packages/x86_64/packages/*.ipk
          if-no-files-found: error
