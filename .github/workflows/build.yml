name: Test Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64 ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGES: luci-app-qmodem
          # 如果需要额外 feed，取消下面的注释
          # EXTRA_FEEDS: src-git luci https://github.com/openwrt/luci.git;main

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/packages/*.ipk
          if-no-files-found: error  # 如果还是没有文件，直接报错提醒
