name: Build QModem for x86_64

on:
  # 手动触发（推荐）
  workflow_dispatch:
  # 也可以启用 push 或 pull_request 自动触发
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:
    name: Build QModem
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 编译 QModem
      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          # 使用稳定的 23.05.4 SDK（如果要用 24.10，改为 x86_64-openwrt-24.10）
          ARCH: x86_64-23.05.4
          # 需要编译的包列表（用空格分隔）
          PACKAGES: qmodem luci-app-qmodem-next luci-app-qmodem-sms luci-app-qmodem-mwan
          # 额外的 feeds（依赖 luci 和 packages）
          EXTRA_FEEDS: |
            src-git luci https://github.com/openwrt/luci.git;openwrt-23.05
            src-git packages https://github.com/openwrt/packages.git;openwrt-23.05
          # 开启详细日志，方便调试
          V: s
        with:
          # 在构建前将 feeds 源替换为 GitHub（解决网络问题）
          pre-build: |
            sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|g' feeds.conf.default
            sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|g' feeds.conf.default

      # 3. 上传编译产物
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qmodem-x86_64-packages
          path: bin/packages/x86_64/packages/*.ipk
          if-no-files-found: error
