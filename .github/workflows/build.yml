name: Test Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }} build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64 ]
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # 正确位置：获取完整历史

      - name: Build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}

      - name: Store packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}-packages
          path: bin/packages/${{ matrix.arch }}/packages/*.ipk
          if-no-files-found: warn  # 容错处理
